[project]
name = "wt"
version = "0.2.0"
description = "State-machine worktree orchestrator with TUI and tmux integration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.0",
    "pydantic>=2.8.0",
    "pyyaml>=6.0.0",
    "rich>=13.8.0",
    "textual>=0.79.0",
    "typer>=0.12.0",
    "uvicorn>=0.40.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
wt = "wt.cli:app"
orch = "orch.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.11",
    "ty>=0.0.11",
]
